summary = "Removing the last block of a configuration without comments beside a repository header takes the header to the end of the file and leaves that one file modified in the root repository."

[fixture]
workspace_git = true

[[step]]
args = ["repo", "remove", "project/docs", "--json"]
stdout = "json"

[[compare.file]]
path = "ws/.winter/config.toml"
mode = "bytes"
reason = "decision:parallel-workspaces/repository-catalog/removal-comment-extent fixes the removed lines"
