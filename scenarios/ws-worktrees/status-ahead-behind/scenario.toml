[[fixture.checkout]]
remote = "lib"
path = "projects/lib"

[[fixture.worktree]]
checkout = "projects/lib"
path = "alpha/lib"
branch = "alpha"
start = "main"

[[fixture.git]]
cwd = "alpha/web"
args = ["commit", "--quiet", "--allow-empty", "-m", "First local change"]

[[fixture.git]]
cwd = "alpha/web"
args = ["commit", "--quiet", "--allow-empty", "-m", "Second local change"]

[[step]]
args = ["ws", "worktrees", "--status", "--json"]
stdout = "json"
