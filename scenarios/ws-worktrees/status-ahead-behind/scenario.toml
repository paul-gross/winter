summary = "Worktrees ahead of, behind, and level with the main branch of their remote show those counts."

[[fixture.remote]]
name = "web"

[[fixture.remote.commit]]
message = "Initial web"
files = { "README.md" = "web fixture\n" }

[[fixture.remote.commit]]
message = "Second web"
files = { "notes.txt" = "web notes\n" }

[[fixture.remote]]
name = "api"

[[fixture.remote.commit]]
message = "Initial api"
files = { "README.md" = "api fixture\n" }

[[fixture.remote.commit]]
message = "Second api"
files = { "notes.txt" = "api notes\n" }

[[fixture.remote]]
name = "lib"

[[fixture.remote.commit]]
message = "Initial lib"
files = { "README.md" = "lib fixture\n" }

[[fixture.remote.commit]]
