[[fixture.checkout]]
remote = "web"
path = "projects/web"

[[fixture.worktree]]
checkout = "projects/web"
path = "alpha/web"
branch = "alpha"
start = "main"

[[fixture.checkout]]
remote = "api"
path = "projects/api"

[[fixture.worktree]]
checkout = "projects/api"
path = "alpha/api"
branch = "alpha"
