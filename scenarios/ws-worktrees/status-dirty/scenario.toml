summary = "A worktree counts a staged file, a changed file, an untracked file, and each file of an untracked directory as dirty."

[[fixture.remote]]
name = "web"

[[fixture.remote.commit]]
message = "Initial web"
files = { "README.md" = "web fixture\n" }

[[fixture.remote.commit]]
message = "Second web"
files = { "notes.txt" = "web notes\n" }

[[fixture.checkout]]
remote = "web"
path = "projects/web"

[[fixture.worktree]]
checkout = "projects/web"
path = "alpha/web"
branch = "alpha"
start = "main"

[[fixture.git]]
cwd = "alpha/web"
args = ["rm", "--quiet", "README.md"]

[[step]]
args = ["ws", "worktrees", "--status", "--json"]
stdout = "json"
