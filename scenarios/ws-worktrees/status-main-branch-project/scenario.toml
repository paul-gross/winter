summary = "A project with a main branch of its own is counted against that branch of its remote."

[[fixture.remote]]
name = "web"

[[fixture.remote.commit]]
message = "Initial web"
files = { "README.md" = "web fixture\n" }

[[fixture.remote.commit]]
message = "First on dev"
files = { "one.txt" = "one\n" }
branch = "dev"

[[fixture.remote.commit]]
message = "Second on dev"
files = { "two.txt" = "two\n" }
branch = "dev"

[[fixture.checkout]]
remote = "web"
path = "projects/web"

[[fixture.worktree]]
checkout = "projects/web"
path = "alpha/web"
branch = "alpha"
start = "main"

[[fixture.git]]
cwd = "alpha/web"
args = ["commit", "--quiet", "--allow-empty", "-m", "Local change"]

[[step]]
args = ["ws", "worktrees", "--status", "--json"]
stdout = "json"
