summary = "A branch pin with a local-only commit is reset to origin/<ref>."

[[fixture.remote]]
name = "lib"

[[fixture.remote.commit]]
message = "Initial lib"
files = { "README.md" = "lib fixture\n" }
tag = "v1"

[[fixture.remote.commit]]
message = "Second lib"
files = { "notes.txt" = "lib notes\n" }
tag = "v2"

[[fixture.checkout]]
remote = "lib"
path = "lib"

[[fixture.git]]
cwd = "lib"
args = ["commit", "--quiet", "--allow-empty", "-m", "Local only"]

[[step]]
args = ["ws", "update", "--json"]
stdout = "json-lines"
