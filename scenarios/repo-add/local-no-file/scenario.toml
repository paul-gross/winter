summary = "Adding with --local creates the local file and leaves the shared file as it was."

[fixture]
workspace_git = true

[[step]]
args = ["repo", "add", "https://fixture.invalid/web.git", "--local", "--json"]
stdout = "json"

[[compare.file]]
path = "ws/.winter/*.toml"
