[global]
# MD018 off: the 120-column wrap can land a `#`-prefixed word at line start; CommonMark does not parse it as a heading, but MD018's autofix would turn it into one
disable = ["MD018"]

[MD004]
style = "dash"

[MD013]
# 120 matches dprint's lineWidth; tables and code fences keep their own formatting, so only prose is held to the ceiling
line-length = 120
tables = false
code-blocks = false
