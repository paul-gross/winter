name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: dprint check
        run: npx --yes dprint@0.55.2 check
      - name: rumdl check
        run: uvx rumdl@0.2.54 check .

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/winter-cli
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version-file: tools/winter-cli/pyproject.toml
      - name: Install
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
