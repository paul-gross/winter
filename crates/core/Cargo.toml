[package]
name = "winter-workspace-core"
description = "Parsing, commands, domain, and adapters of the winter-workspace binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
thiserror = "2"
toml = { version = "1.2", features = ["preserve_order"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
serde_json = "1"
sha1 = "0.10"
fastrand = "2"
rustix = { version = "1.1", features = ["event", "process"] }

[dev-dependencies]
winter-workspace-test-support = { workspace = true }
