[package]
name = "winter-workspace"
description = "The command-line tool that manages a Winter workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
winter-workspace-core = { workspace = true }

[dev-dependencies]
winter-workspace-test-support = { workspace = true }

[features]
scenarios = [] # selects the test target below; no source file tests cfg(feature = "scenarios")

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
harness = false
required-features = ["scenarios"]
